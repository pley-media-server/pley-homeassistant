rules:
  # Bronze
  action-setup:
    status: exempt
    comment: |
      The integration has no actions of its own. Playing a title on a device
      is the media player's play_media action.
  appropriate-polling:
    status: done
    comment: |
      The server's events say when something changed. Polling only makes up
      for a missed event: every 30 seconds while something plays, every 5
      minutes when nothing does.
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: exempt
    comment: |
      The API client is part of the integration, in pleyclient/, and has no
      requirements of its own.
  docs-actions:
    status: exempt
    comment: The integration has no actions of its own.
  docs-conditions:
    status: exempt
    comment: The integration has no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration has no triggers.
  entity-event-setup:
    status: done
    comment: |
      Entities follow the coordinator, which listens to the server's events
      for as long as the entry is loaded.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: The data update coordinator logs when fetching fails and recovers.
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: done
    comment: |
      Pley servers are found by Bonjour (_pley._tcp), once it is turned on in
      Pley's Settings → Network; the TXT record's id identifies the server.
  discovery-update-info:
    status: done
    comment: |
      A server found at a new IP address moves its entry there, once it
      answers a challenge with an HMAC under the sign-in's proof key. A
      sign-in without a key, and an address someone chose (a host name, or
      https), are kept where they are.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category:
    status: done
    comment: Each media player is its device's main entity, so has no category.
  entity-device-class:
    status: done
    comment: |
      A TV's media player has the TV device class. Media players have no
      class for phones, tablets, computers or browsers.
  entity-disabled-by-default:
    status: done
    comment: |
      Only TVs start enabled, unless the options choose other kinds of
      device.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow:
    status: done
    comment: |
      The server's address can be changed, for the same server only: it must
      prove it is the one signed in to before the entry uses the address.
  repair-issues:
    status: done
    comment: |
      A server older than the integration needs, and something other than the
      server answering at its address, each say what to do and clear once
      fixed. A sign-in the server refuses starts reauthentication instead.
  stale-devices:
    status: done
    comment: |
      A device Pley hasn't listed for 30 days is removed. Devices come and go
      as their apps open and close, so absence alone doesn't mean gone; one
      not listed now can also be deleted by hand.

  # Platinum
  async-dependency: done
  inject-websession:
    status: done
    comment: The client takes Home Assistant's aiohttp session.
  strict-typing:
    status: done
    comment: |
      mypy runs in strict mode on the integration and its client, which ships
      a py.typed marker.
