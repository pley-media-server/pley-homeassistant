rules:
  # Bronze
  action-setup:
    status: exempt
    comment: |
      The integration has no actions of its own. Playing a title on a device
      is the media player's play_media action.
  appropriate-polling: todo
  brands: done
  common-modules: todo
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: exempt
    comment: The integration has no requirements.
  docs-actions:
    status: exempt
    comment: The integration has no actions of its own.
  docs-conditions:
    status: exempt
    comment: The integration has no conditions.
  docs-high-level-description: todo
  docs-installation-instructions: todo
  docs-removal-instructions: todo
  docs-triggers:
    status: exempt
    comment: The integration has no triggers.
  entity-event-setup: todo
  entity-unique-id: todo
  has-entity-name: todo
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: todo
  config-entry-unloading: done
  docs-configuration-parameters: todo
  docs-installation-parameters: todo
  entity-unavailable: todo
  integration-owner: done
  log-when-unavailable: todo
  parallel-updates: todo
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: todo
  diagnostics: todo
  discovery:
    status: done
    comment: |
      Pley servers are found by Bonjour (_pley._tcp), once it is turned on in
      Pley's Settings → Network; the TXT record's id identifies the server.
  discovery-update-info:
    status: done
    comment: |
      A server found at a new IP address moves its entry there, once the
      server there proves it is the one signed in to. An address someone
      chose (a host name, or https) is kept.
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices: todo
  entity-category: todo
  entity-device-class: todo
  entity-disabled-by-default: todo
  entity-translations: todo
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow: todo
  repair-issues: todo
  stale-devices: todo

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
